services:
  app:
    image: sonoff-controller:latest
    build: .
    init: true
    restart: always
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: true
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /config/config.json
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - controller_data:/data
      - ./config/config.example.json:/config/config.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  caddy:
    image: caddy:2.10.0-alpine
    profiles: [https]
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  controller_data:
  caddy_data:
  caddy_config:

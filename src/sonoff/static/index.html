<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonoff · Контроль енергії</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><main><header><div><span class="eyebrow">SONOFF CONTROLLER</span><h1>Енергія під контролем</h1><p>Розумні розетки та стабільне живлення</p></div><span class="badge" id="mode">Підключення…</span></header>
<section class="overview"><div><span class="eyebrow">МЕРЕЖА 220 В</span><h2 id="mains">Перевіряємо…</h2><p id="sensor"></p></div><div><span class="eyebrow">EWElink</span><h2 id="cloud">—</h2><p>Стан із хмари · синхронізація кожні 2 хвилини</p></div></section>
<div id="notice" role="status"></div>
<section><div class="section-title"><h2>Ваші розетки</h2><div class="actions"><button id="authorize">Підключити eWeLink</button><button id="discover">Знайти розетки</button></div></div><div id="devices"></div><div class="grid" id="sockets"></div></section>
<section id="simulation" hidden><div class="section-title"><h2>Симуляція датчика</h2></div><div class="actions"><button data-sim="true">Мережа є</button><button data-sim="false">Мережі немає</button><button data-sim="null">Стан невідомий</button></div></section>
<section><h2>Останні події</h2><div id="events" class="events"></div></section><footer>LOW = мережа є · OFF одразу · ON після стабільного живлення</footer>
</main><template id="socket-template"><article class="socket"><div class="section-title"><h3></h3><span class="badge status"></span></div><p class="connection"></p><div class="countdown"><span class="eyebrow">ДО УВІМКНЕННЯ</span><output class="turn-on-time" aria-label="Час до увімкнення">00:00</output><p class="turn-on-note"></p></div><div class="timer"></div><p class="socket-error"></p><div class="actions"><button data-command="on">Увімкнути</button><button data-command="off">Вимкнути</button><button data-command="auto">Авто</button></div><details><summary>Правила та затримки</summary><form><label>Назва<input name="name" required maxlength="100"></label><div class="rules"><label>Мережа є<select name="present_action"><option value="on">Увімкнути</option><option value="off">Вимкнути</option><option value="hold">Без дії</option></select></label><label>Затримка, хв<input name="present_delay" type="number" min="0" max="1440" step="0.1" required></label><label>Мережі немає<select name="absent_action"><option value="off">Вимкнути</option><option value="on">Увімкнути (блокується без мережі)</option><option value="hold">Без дії</option></select></label><label>Затримка, хв<input name="absent_delay" type="number" min="0" max="1440" step="0.1" required></label></div><button type="submit">Зберегти правила</button></form></details></article></template></body></html>
